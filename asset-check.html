<script>(()=>{const items=[['player1','PLAYER 1','/assets/v9/player1.webp?v=122'],['player2','PLAYER 2','/assets/v9/player2.webp?v=122'],['player3','PLAYER 3','/assets/v9/player3.webp?v=122'],['player4','PLAYER 4','/assets/v9/player4.webp?v=122'],['enemy1','ENEMY 1'],['enemy2','ENEMY 2'],['enemy3','ENEMY 3'],['enemy4','ENEMY 4'],['boss1','BOSS 1'],['boss2','BOSS 2'],['boss3','BOSS 3'],['boss4','BOSS 4'],['planet-earth','EARTH'],['planet-moon','MOON'],['planet-mars','MARS'],['planet-hole','BLACK HOLE'],['pickup-energy','ENERGY'],['pickup-repair','REPAIR'],['pickup-shield','SHIELD'],['pickup-weapon','WEAPON'],['pickup-rocket','ROCKET'],['pickup-bomb','BOMB']];const $=s=>document.querySelector(s);const load=(key,label,direct)=>new Promise(resolve=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<span class="ok wait">WAIT</span><div class="thumb"><img alt="${label}"></div><div class="name">${label}</div><div class="meta">${key}</div>`;$('#grid').appendChild(card);const img=card.querySelector('img'),badge=card.querySelector('.ok'),meta=card.querySelector('.meta');const src=direct||(window.V9_ASSET_DATA||{})[key]||'';let done=false;const finish=(ok)=>{if(done)return;done=true;clearTimeout(t);badge.textContent=ok?'OK':'FAIL';badge.className='ok '+(ok?'':'bad');meta.textContent=ok?`${key} · ${img.naturalWidth}×${img.naturalHeight}`:`${key} · FAILED`;resolve({key,ok,w:img.naturalWidth||0,h:img.naturalHeight||0})};img.onload=()=>finish(true);img.onerror=()=>finish(false);const t=setTimeout(()=>finish(false),6000);img.src=src;});async function run(){auditRetried=false;$('#grid').innerHTML='';$('#ok').textContent='0';$('#failed').textContent='0';$('#status').textContent='CHECKING';const r=await Promise.all(items.map(x=>load(...x)));const ok=r.filter(x=>x.ok).length,failed=r.length-ok;$('#ok').textContent=ok;$('#failed').textContent=failed;$('#status').textContent=failed?'CHECK':'READY';const report={ts:Date.now(),version:'12.2',total:r.length,ok,failed:r.filter(x=>!x.ok).map(x=>x.key),results:r};localStorage.setItem('cosmicExplorerV122AssetAudit',JSON.stringify(report));}$('#retry').onclick=run;$('#clear').onclick=async()=>{if('caches'in window){for(const k of await caches.keys())if(k.startsWith('cosmic-explorer-'))await caches.delete(k);}location.reload();};run();})();</script></body></html>
