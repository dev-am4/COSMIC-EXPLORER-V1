<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020611"><title>COSMIC EXPLORER · OPERATOR</title><style>:root{--bg:#020611;--panel:#071027;--line:rgba(112,220,255,.18);--text:#eefaff;--cyan:#6beaff;--blue:#6278ff;--pink:#ff62c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#132b64 0,transparent 34%),radial-gradient(circle at 10% 80%,rgba(255,80,190,.10),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:22px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--cyan);opacity:.7}h1{font-size:clamp(30px,5vw,58px);line-height:.92;margin:7px 0 8px;letter-spacing:-.05em}.sub{opacity:.62;font-size:13px}.launch{display:flex;gap:8px;flex-wrap:wrap}.btn,button,select,input{font:inherit}.btn,button{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;font-weight:800;letter-spacing:.04em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.primary{background:linear-gradient(100deg,#4fdcff,#5d72ff 55%,#b75fff);border:0}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:linear-gradient(180deg,rgba(8,20,49,.78),rgba(3,9,23,.86));border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.card h2{margin:0 0 16px;font-size:17px}.field{display:grid;grid-template-columns:1fr minmax(150px,260px);align-items:center;gap:14px;padding:13px 0;border-top:1px solid rgba(255,255,255,.05)}.field:first-of-type{border-top:0}.field label b{display:block;font-size:13px}.field label span{display:block;margin-top:4px;font-size:11px;opacity:.55;line-height:1.4}select,input[type=range]{width:100%}select{height:42px;border-radius:12px;border:1px solid var(--line);background:#071228;color:#fff;padding:0 12px}.switch{justify-self:end;position:relative;width:56px;height:32px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);cursor:pointer}.switch i{position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}.switch.on{background:linear-gradient(90deg,#36cde9,#536dff)}.switch.on i{left:28px}.range{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}.range output{text-align:right;font-weight:900;color:var(--cyan)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:15px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}.stat span{font-size:9px;letter-spacing:.13em;opacity:.55}.stat b{display:block;margin-top:5px;font-size:24px}.leader{display:grid;gap:6px;margin-top:12px;max-height:315px;overflow:auto}.row{display:grid;grid-template-columns:38px 1fr 70px;gap:8px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.035)}.row strong{font-size:15px}.row span{font-size:10px;opacity:.62}.danger{color:#ff9db8;border-color:rgba(255,85,120,.22)}.footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.saved{font-size:11px;color:#90f0ff;opacity:0;transition:.2s}.saved.show{opacity:1}@media(max-width:760px){body{padding:12px}.top{display:block}.launch{margin-top:14px}.grid{grid-template-columns:1fr}.field{grid-template-columns:1fr}.switch{justify-self:start}.card{border-radius:20px}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">EXHIBITION CONTROL</div><h1>COSMIC EXPLORER<br>OPERATOR</h1><div class="sub">ตั้งค่าหน้างานโดยไม่ต้องแก้โค้ด · เก็บค่าไว้ในเครื่องนี้</div></div><div class="launch"><a class="btn primary" href="/">LAUNCH GAME</a><button id="full">FULLSCREEN</button></div></div><div class="grid"><section class="card"><h2>GAMEPLAY & KIOSK</h2><div class="field"><label><b>Difficulty</b><span>ปรับความเร็ว HP และความแรงของศัตรู/Boss</span></label><select id="difficulty"><option value="easy">EASY</option><option value="normal">NORMAL</option><option value="hard">HARD</option></select></div><div class="field"><label><b>Attract Mode Delay</b><span>เวลาว่างหน้าแรกก่อนเข้า Demo Mode อัตโนมัติ</span></label><div class="range"><input id="attract" type="range" min="8" max="60" step="1"><output id="attractOut">15s</output></div></div><div class="field"><label><b>Sound</b><span>ค่าเริ่มต้นของ SFX + Music เมื่อเปิดเกม</span></label><button class="switch" id="sound" aria-label="Sound"><i></i></button></div><div class="field"><label><b>Kiosk Mode</b><span>ซ่อนปุ่ม Operator บนหน้าเกม เหมาะกับจอนิทรรศการ</span></label><button class="switch" id="kiosk" aria-label="Kiosk"><i></i></button></div><div class="footer"><div><button id="save" class="primary">SAVE SETTINGS</button> <span id="saved" class="saved">SAVED</span></div><button id="defaults">RESET DEFAULTS</button></div></section><section class="card"><h2>LOCAL ARCADE DATA</h2><div class="stats"><div class="stat"><span>BEST SCORE</span><b id="best">0</b></div><div class="stat"><span>RUNS STORED</span><b id="runs">0</b></div></div><div class="leader" id="leader"></div><div class="footer"><button id="clearBoard" class="danger">CLEAR TOP 10</button><button id="clearBest" class="danger">CLEAR BEST SCORE</button></div></section></div></div><script>(()=>{const S='cosmicExplorerV12Settings',L='cosmicExplorerV12Leaderboard';const $=s=>document.querySelector(s);let cfg={difficulty:'normal',attractDelay:15,sound:true,kiosk:false};try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(S)||'{}'))}catch(_){};const setSwitch=(el,on)=>{el.classList.toggle('on',!!on);el.dataset.on=on?'1':'0'};const sync=()=>{$('#difficulty').value=cfg.difficulty;$('#attract').value=cfg.attractDelay;$('#attractOut').value=cfg.attractDelay+'s';setSwitch($('#sound'),cfg.sound);setSwitch($('#kiosk'),cfg.kiosk)};const board=()=>{let b=[];try{b=JSON.parse(localStorage.getItem(L)||'[]')}catch(_){};$('#runs').textContent=b.length;const best=Math.max(Number(localStorage.getItem('cosmicExplorerV11HighScore')||0),b[0]?.score||0);$('#best').textContent=best.toLocaleString();$('#leader').innerHTML=b.length?b.map((r,i)=>`<div class="row"><b>#${i+1}</b><strong>${Number(r.score||0).toLocaleString()}</strong><span>RANK ${r.rank||'C'}</span></div>`).join(''):'<div class="sub">ยังไม่มีคะแนน</div>'};$('#attract').oninput=e=>$('#attractOut').value=e.target.value+'s';$('#sound').onclick=()=>setSwitch($('#sound'),$('#sound').dataset.on!=='1');$('#kiosk').onclick=()=>setSwitch($('#kiosk'),$('#kiosk').dataset.on!=='1');$('#save').onclick=()=>{cfg={difficulty:$('#difficulty').value,attractDelay:Number($('#attract').value),sound:$('#sound').dataset.on==='1',kiosk:$('#kiosk').dataset.on==='1'};localStorage.setItem(S,JSON.stringify(cfg));$('#saved').classList.add('show');setTimeout(()=>$('#saved').classList.remove('show'),1200)};$('#defaults').onclick=()=>{cfg={difficulty:'normal',attractDelay:15,sound:true,kiosk:false};localStorage.setItem(S,JSON.stringify(cfg));sync()};$('#clearBoard').onclick=()=>{if(confirm('Clear Top 10 on this device?')){localStorage.removeItem(L);board()}};$('#clearBest').onclick=()=>{if(confirm('Clear best score on this device?')){localStorage.removeItem('cosmicExplorerV11HighScore');board()}};$('#full').onclick=()=>{const r=document.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen)?.call(r)};sync();board()})();</script></body></html>
