<div id="app">
  <canvas id="game"></canvas>

  <div id="topHud" class="panel hidden">
    <div class="hud compact"><img id="sectorIcon" alt=""><div><div class="label">SECTOR</div><div class="value" id="sectorText">EARTH</div></div></div>
    <div class="hud compact"><div><div class="label">SCORE</div><div class="value" id="scoreText">0</div></div></div>
    <div class="hud compact meter"><div style="width:100%"><div class="label">HP</div><div class="value" id="hpText">100%</div><div class="bar"><div id="hpFill" class="fill hp" style="width:100%"></div></div></div></div>
    <div class="hud compact meter"><div style="width:100%"><div class="label">ENERGY</div><div class="value" id="energyText">100%</div><div class="bar"><div id="energyFill" class="fill" style="width:100%"></div></div></div></div>
    <div class="hud compact"><img id="specialIcon" alt=""><div><div class="label">SPECIAL</div><div class="value" id="specialText">0</div></div></div>
    <div id="objective" class="hud compact"><div><div class="label">OBJECTIVE</div><div class="value" id="objectiveText">CLEAR THE SECTOR</div></div></div>
  </div>

  <div id="hint">DRAG TO MOVE · AUTO FIRE</div>
  <div id="controls" class="hidden">
    <div class="control-cluster"><div class="dpad"><button class="ctrl-btn" id="up">▲</button><button class="ctrl-btn" id="left">◀</button><button class="ctrl-btn" id="right">▶</button><button class="ctrl-btn" id="down">▼</button></div></div>
    <div class="control-cluster actions"><button id="boostBtn" class="action-btn"><small>BOOST</small><b>⚡</b></button><button id="specialBtn" class="action-btn"><small>SPECIAL</small><b id="specialBtnType">🚀</b></button></div>
  </div>

  <div id="home">
    <div class="home-card">
      <div class="headline"><div class="brand"><div class="v11tag">ARCADE SPACE MISSION · V13.2 ENEMY INTELLIGENCE</div><h1>COSMIC<br>EXPLORER</h1><div class="missionline">EARTH · MOON · MARS · UNKNOWN</div><div class="startcopy">CHOOSE YOUR SHIP</div></div><button id="soundBtn" class="btn secondary sound-mini" aria-label="Sound">SFX + MUSIC: ON</button></div>
      <div class="route-icons" id="routeIcons"></div>
      <div class="ship-select" id="shipSelect"></div>
      <div class="start-row"><div class="startcopy">SWIPE / ARROWS TO CHANGE SHIP</div><button id="startBtn" class="btn">START MISSION</button></div>
    </div>
  </div>

  <div id="sectorBanner" class="hidden"><div class="banner-inner"><img id="bannerImg" alt=""><div><div style="font-size:11px;opacity:.74">NOW ENTERING</div><div id="bannerText" style="font-size:20px;font-weight:900">EARTH</div></div></div></div>
  <div id="toast" class="hidden"><div class="toast-inner"><img id="toastImg" alt=""><div id="toastText" style="font-weight:800">Pickup</div></div></div>
  <div id="gameOver" class="hidden"><div class="over-card"><h2 id="gameOverTitle">MISSION END</h2><div id="summary"></div><button id="restartBtn" class="btn">PLAY AGAIN</button></div></div>
</div>
